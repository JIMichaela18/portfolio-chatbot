server.port=${PORT:8080}

portfolio.cors.allowed-origin=https://jimichaela18.github.io
portfolio.cors.allowed-methods=POST,OPTIONS
portfolio.cors.allowed-headers=Content-Type
portfolio.cors.max-age-seconds=3600

portfolio.rag.enabled=false
portfolio.rag.max-results=4
portfolio.rag.chunk-size=500
portfolio.rag.chunk-overlap=50

portfolio.rate-limit.requests-per-minute=10
portfolio.rate-limit.window=1m

spring.jackson.deserialization.fail-on-unknown-properties=true
