server.port=${PORT:8080}

portfolio.cors.allowed-origin=https://jimichaela18.github.io
portfolio.cors.allowed-methods=POST,OPTIONS
portfolio.cors.allowed-headers=Content-Type
portfolio.cors.max-age-seconds=3600

portfolio.rag.enabled=false
portfolio.rag.max-results=4
portfolio.rag.chunk-size=500
portfolio.rag.chunk-overlap=50

portfolio.rate-limit.requests-per-minute=10
portfolio.rate-limit.window=1m

spring.jackson.deserialization.fail-on-unknown-properties=true

# Application logging: operational INFO, chat/security warnings and errors, third-party HTTP WARN.
logging.level.root=WARN
logging.level.io.github.jimichaela18.portfoliochatbot=INFO
logging.level.io.github.jimichaela18.portfoliochatbot.chat=WARN
logging.level.io.github.jimichaela18.portfoliochatbot.portfolio=INFO
logging.level.io.github.jimichaela18.portfoliochatbot.security=WARN
logging.level.io.github.jimichaela18.portfoliochatbot.error=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.apache.tomcat=WARN
logging.level.dev.langchain4j=WARN
logging.level.ai.djl=WARN
